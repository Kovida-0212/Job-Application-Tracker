{% extends "base.html" %}
{% block title %}Add Application · JobTrack{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-heading">
        <div>
            <div class="eyebrow">NEW OPPORTUNITY</div>
            <h1>Add Application</h1>
            <p>Record the details of a job you applied for.</p>
        </div>
    </div>

    <div class="panel-card form-card">
        <form method="POST">
            <div class="section-title"><i class="bi bi-building"></i> Job Details</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Company <span>*</span></label>
                    <input type="text" name="company" class="form-control" placeholder="e.g. Google" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Job Role <span>*</span></label>
                    <input type="text" name="role" class="form-control" placeholder="e.g. Python Developer" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Application Date <span>*</span></label>
                    <input type="date" name="application_date" class="form-control" value="{{ today }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for status in statuses %}
                        <option value="{{ status }}">{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Interview Date</label>
                    <input type="date" name="interview_date" class="form-control">
                </div>
            </div>

            <div class="section-title mt-4"><i class="bi bi-file-earmark-text"></i> Application Notes</div>
            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Resume Version</label>
                    <input type="text" name="resume_version" class="form-control" placeholder="e.g. Resume_v3">
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="5" placeholder="Recruiter name, salary, job link, preparation notes, follow-up details..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('applications') }}" class="btn btn-light-custom">Cancel</a>
                <button type="submit" class="btn btn-add"><i class="bi bi-check-lg me-1"></i> Save Application</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
